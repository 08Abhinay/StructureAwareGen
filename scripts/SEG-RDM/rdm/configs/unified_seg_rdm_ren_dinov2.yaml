# Unified Segmentation RDM — REN DINOv2 ViT-L/14 Configuration
# Uses pre-extracted REN region tokens (1024d) + DINOv2 CLS (1024d) from single H5 file.
# Both global_vec (CLS) and seg_tokens (regions) come from DINOv2 ViT-L/14 → 1024-dim.
# Same embedding space → alignment loss is meaningful.

model:
  target: rdm.models.diffusion.ddpm.UnifiedSegRDM
  params:
    max_segments: 100  # REN produces ~77 regions avg (vs SAM's 200+)
    normalize_seg_tokens: true  # z-score per token so seg scale matches CLS
    lambda_diversity: 0.05  # Diversity loss weight
    lambda_alignment: 0.05  # Alignment loss weight (same space → enabled)

    # Diffusion parameters
    timesteps: 1000
    beta_schedule: "linear"
    linear_start: 0.0001
    linear_end: 0.02
    parameterization: "x0"

    # Loss weights
    loss_type: "l2"
    l_simple_weight: 1.0
    original_elbo_weight: 0.0
    learn_logvar: false

    # Model architecture
    conditioning_key: null
    channels: 1024  # Token dimension (DINOv2 ViT-L/14)
    image_size: 101  # Sequence length (max_segments + 1 global token)

    # EMA
    use_ema: true
    clip_denoised: false

    # Unified Transformer backbone
    unet_config:
      target: rdm.modules.diffusionmodules.unified_transformer.UnifiedSegTransformer
      params:
        token_dim: 1024  # Input/output token dimension
        d_model: 1024  # Transformer hidden dimension (matches token_dim)
        n_heads: 16  # 1024 / 64 = 16 heads
        n_layers: 8
        d_ff: 4096  # 4 * d_model
        dropout: 0.1
        max_seq_len: 128  # max_segments + buffer
        time_emb_dim: 1024

    # No pretrained encoder needed — everything pre-extracted to H5
    pretrained_enc_config: null

    cond_stage_config: "__is_unconditional__"

    input_scale: 1.0
    scale_factor: 1.0
    scale_by_std: false


# Data configuration
data:
  target: rdm.data.seg_dataset.SegmentationMaskDataset
  params:
    image_dir: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/dataset/imagenet-1K-hf/train"

    # REN DINOv2 H5 — contains region embeddings (1024d) AND cls_emb (1024d)
    h5_path: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/h5_embeddings/region_ren_dinov2_flat.h5"
    mask_npz_dir: null

    # No separate external H5 needed — CLS comes from the same REN H5 via cls_emb
    # ijepa_h5_path: null
    # ijepa_lookup_json: null

    max_segments: 100
    image_size: 256
    file_ext: "*.JPEG"
    normalize: true
    emb_source: "dinov2"

  # DataLoader settings
  batch_size: 32
  num_workers: 8
  shuffle: true
  pin_memory: true


# Training configuration
training:
  learning_rate: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 5000
  max_steps: 500000
