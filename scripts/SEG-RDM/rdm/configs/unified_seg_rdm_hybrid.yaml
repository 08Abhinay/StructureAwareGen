# Unified Segmentation RDM — Hybrid Configuration
# I-JEPA region tokens (256d) + MoCo v3 CLS through MLP head (256d)
#
# Key difference from unified_seg_rdm_region_ijepa.yaml:
#   - pretrained_enc uses MoCo v3 ViT-L (not I-JEPA)
#   - pretrained_enc_withproj: true  → 256d CLS (matches channels)
#   - External H5 embeddings routed as cls_emb (no projection/z-score at runtime)
#   - cls_from_external_h5: true in data params

model:
  target: rdm.models.diffusion.ddpm.UnifiedSegRDM
  params:
    max_segments: 250
    lambda_diversity: 0.05
    lambda_alignment: 0.0   # Disabled: cross-encoder (MoCo global vs I-JEPA regions) — spaces are incompatible
    
    # Diffusion parameters
    timesteps: 1000
    beta_schedule: "linear"
    linear_start: 0.0001
    linear_end: 0.02
    parameterization: "x0"
    
    # Loss weights
    loss_type: "l2"
    l_simple_weight: 1.0
    original_elbo_weight: 0.0
    learn_logvar: false
    
    # Model architecture
    conditioning_key: null
    channels: 256
    image_size: 251
    
    # EMA
    use_ema: true
    clip_denoised: false
    
    # Unified Transformer backbone
    unet_config:
      target: rdm.modules.diffusionmodules.unified_transformer.UnifiedSegTransformer
      params:
        token_dim: 256
        d_model: 768
        n_heads: 12
        n_layers: 8
        d_ff: 3072
        dropout: 0.1
        max_seq_len: 256
        time_emb_dim: 256
    
    # MoCo v3 encoder (loaded but NOT called at runtime when cls_emb is present)
    # Kept for architectural consistency and correct fallback behaviour
    pretrained_enc_config:
      target: rdm.pretrained_enc.models_pretrained_enc
      params:
        pretrained_enc_arch: "mocov3_vit_large"
        pretrained_enc_path: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/scripts/SEG-RDM/rdm/pretrained_enc_ckpts/mocov3/vitl.pth.tar"
        proj_dim: 256
        pretrained_enc_withproj: true
    
    cond_stage_config: "__is_unconditional__"
    
    input_scale: 1.0
    scale_factor: 1.0
    scale_by_std: false


# Data configuration
data:
  target: rdm.data.seg_dataset.SegmentationMaskDataset
  params:
    # Image directory
    image_dir: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/dataset/imagenet-1K-hf/train"
    
    # Region embeddings from flat H5 (I-JEPA 256d — unchanged)
    h5_path: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/h5_embeddings/region_emb_flat.h5"
    mask_npz_dir: null
    
    # Global CLS embeddings from MoCo v3 flat H5 (256d, z-score normalised)
    ijepa_h5_path: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/h5_embeddings/moco_cls_flat.h5"
    ijepa_lookup_json: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/h5_embeddings/moco_cls_lookup.json"
    cls_from_external_h5: true  # Route as cls_emb (skip projection/z-score in ddpm.py)
    
    ijepa_cache_dir: null
    
    max_segments: 250
    image_size: 256
    file_ext: "*.JPEG"
    normalize: true
    emb_source: "region"
  
  # DataLoader settings
  batch_size: 32
  num_workers: 8
  shuffle: true
  pin_memory: true


# Training configuration
training:
  # Optimization
  learning_rate: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 5000
  max_steps: 500000
  
  # Learning rate schedule
  scheduler:
    target: torch.optim.lr_scheduler.CosineAnnealingLR
    params:
      T_max: 500000
  
  # Gradient clipping
  gradient_clip_val: 1.0
  
  # Mixed precision
  use_fp16: true
  
  # Logging
  log_every_n_steps: 100
  val_check_interval: 5000
  
  # Checkpointing
  save_every_n_steps: 10000
  keep_n_checkpoints: 5


# Logging configuration
logging:
  log_dir: "rdm/rdm_out"
  wandb:
    project: "unified-seg-rdm"
    name: "hybrid-ijepa-regions-moco-cls"
    enabled: true
