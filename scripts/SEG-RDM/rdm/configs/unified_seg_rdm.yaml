# Unified Segmentation RDM Configuration
# Generates both global vectors and segmentation tokens via unified transformer

model:
  target: rdm.models.diffusion.ddpm.UnifiedSegRDM
  params:
    # SAM parameters (embeddings loaded by dataset, not model)
    max_segments: 250  # Maximum number of segments (250 from SAM + 1 global = 251 total)
    lambda_diversity: 0.05  # Diversity loss weight (reduced to avoid over-dominating total loss)
    lambda_alignment: 0.05  # Alignment loss weight (global-segment consistency)
    
    # IJEPA cache (optional - speeds up training by using pre-extracted embeddings)
    # Set to null or omit to use runtime extraction instead
    # ijepa_cache_dir: /scratch/gilbreth/abelde/Thesis/StructureAwareGen/scripts/SEG-RDM/rdm/output_dir/ijepa_embeddings
    
    # Diffusion parameters
    timesteps: 1000
    beta_schedule: "linear"
    linear_start: 0.0001
    linear_end: 0.02
    parameterization: "x0"  # Predict clean data directly (more stable for features)
    
    # Loss weights
    loss_type: "l2"
    l_simple_weight: 1.0
    original_elbo_weight: 0.0
    learn_logvar: false
    
    # Model architecture
    conditioning_key: null  # Unconditional by default, change to "crossattn" for class conditioning
    channels: 256  # Token dimension
    image_size: 251  # Sequence length (max_segments + 1 global token)
    
    # EMA and checkpointing
    use_ema: true
    clip_denoised: false
    
    # Unified Transformer backbone
    unet_config:
      target: rdm.modules.diffusionmodules.unified_transformer.UnifiedSegTransformer
      params:
        token_dim: 256  # Input/output token dimension (SAM embeddings are 256-dim)
        d_model: 768  # Transformer hidden dimension (BERT-base size)
        n_heads: 12  # Number of attention heads
        n_layers: 8  # Number of transformer blocks (8-12 recommended)
        d_ff: 3072  # Feedforward dimension (4 * d_model)
        dropout: 0.1  # Dropout probability
        max_seq_len: 256  # Maximum sequence length
        time_emb_dim: 256  # Timestep embedding dimension
    
    # I-JEPA encoder for global vectors
    pretrained_enc_config:
      target: rdm.pretrained_enc.models_pretrained_enc
      params:
        pretrained_enc_arch: "ijepa_vit_h14"  # I-JEPA ViT-H/14
        pretrained_enc_path: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/scripts/SEG-RDM/rdm/pretrained_enc_ckpts/ijepa/IN1K-vit.h.14-300e.pth.tar"  # UPDATE THIS PATH
        proj_dim: 256  # Project I-JEPA output to 256-dim
        pretrained_enc_withproj: false
    
    # No conditioning (unconditional)
    cond_stage_config: "__is_unconditional__"
    
    # Scaling
    input_scale: 1.0
    scale_factor: 1.0
    scale_by_std: false


# Data configuration
data:
  target: rdm.data.seg_dataset.SegmentationMaskDataset
  params:
    # CORRECTED PATHS for ImageNet + SAM cache
    image_dir: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/dataset/imagenet-1K-hf/train"
    mask_npz_dir: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/sam_cache_unified"  # Will search recursively in subdirs (0/masks_npz/, 1/masks_npz/, etc.)
    max_segments: 250
    image_size: 256
    file_ext: "*.JPEG"  # ImageNet uses .JPEG (uppercase)
    normalize: true  # Normalize to [-1, 1] for DDPM
  
  # DataLoader settings
  batch_size: 32
  num_workers: 8
  shuffle: true
  pin_memory: true


# Training configuration
training:
  # Optimization
  learning_rate: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 5000
  max_steps: 500000
  
  # Learning rate schedule
  scheduler:
    target: torch.optim.lr_scheduler.CosineAnnealingLR
    params:
      T_max: 500000
      eta_min: 1.0e-6
  
  # Gradient settings
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  
  # Logging
  log_every_n_steps: 100
  val_check_interval: 5000
  save_checkpoint_every_n_steps: 10000
  
  # Checkpointing
  checkpoint_dir: "checkpoints/unified_seg_rdm"
  resume_from_checkpoint: null  # Path to checkpoint to resume from
  
  # Validation
  num_val_samples: 8  # Number of samples to generate during validation
  
  # Mixed precision
  use_fp16: true
  
  # Distributed training
  num_gpus: 1  # Set to >1 for multi-GPU training
  strategy: "ddp"  # "ddp" or "ddp_spawn"


# Evaluation/Inference configuration
inference:
  # Sampling parameters
  num_samples: 16
  batch_size: 8
  num_segments: 180  # Target number of segments to generate
  
  # DDPM sampling
  ddpm_steps: 1000  # Use full 1000 steps for best quality
  ddpm_eta: 0.0  # 0 = deterministic (DDIM), 1 = stochastic (DDPM)
  
  # Output
  output_dir: "samples/unified_seg_rdm"
  save_intermediates: false  # Save intermediate denoising steps
  
  # Visualization
  visualize_masks: true  # Generate mask visualizations
  visualize_attention: false  # Generate attention maps (expensive)


# Logging and monitoring
logging:
  use_wandb: true
  wandb_project: "unified-seg-rdm"
  wandb_entity: null  # Your wandb username/team
  wandb_run_name: "unified-seg-rdm-v1"
  
  # TensorBoard
  use_tensorboard: true
  tensorboard_dir: "logs/tensorboard"
  
  # What to log
  log_images: true
  log_gradients: false
  log_model_architecture: true
