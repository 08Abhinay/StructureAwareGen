# Unified Segmentation RDM Configuration
# Uses NPZ files for region embeddings + H5 file for IJEPA embeddings

model:
  target: rdm.models.diffusion.ddpm.UnifiedSegRDM
  params:
    max_segments: 250
    lambda_diversity: 0.05
    lambda_alignment: 0.05
    
    # Diffusion parameters
    timesteps: 1000
    beta_schedule: "linear"
    linear_start: 0.0001
    linear_end: 0.02
    parameterization: "x0"
    
    # Loss weights
    loss_type: "l2"
    l_simple_weight: 1.0
    original_elbo_weight: 0.0
    learn_logvar: false
    
    # Model architecture
    conditioning_key: null
    channels: 256
    image_size: 251
    
    # EMA
    use_ema: true
    clip_denoised: false
    
    # Unified Transformer backbone
    unet_config:
      target: rdm.modules.diffusionmodules.unified_transformer.UnifiedSegTransformer
      params:
        token_dim: 256
        d_model: 768
        n_heads: 12
        n_layers: 8
        d_ff: 3072
        dropout: 0.1
        max_seq_len: 256
        time_emb_dim: 256
    
    # I-JEPA encoder for global vectors
    pretrained_enc_config:
      target: rdm.pretrained_enc.models_pretrained_enc
      params:
        pretrained_enc_arch: "ijepa_vit_h14"
        pretrained_enc_path: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/scripts/SEG-RDM/rdm/pretrained_enc_ckpts/ijepa/IN1K-vit.h.14-300e.pth.tar"
        proj_dim: 256
        pretrained_enc_withproj: false
    
    cond_stage_config: "__is_unconditional__"
    
    input_scale: 1.0
    scale_factor: 1.0
    scale_by_std: false


# Data configuration
data:
  target: rdm.data.seg_dataset.SegmentationMaskDataset
  params:
    # Image directory
    image_dir: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/dataset/imagenet-1K-hf/train"
    
    # Region embeddings from flat H5 file (MAIN EMBEDDINGS)
    h5_path: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/h5_embeddings/region_emb_flat.h5"
    mask_npz_dir: null  # No NPZ fallback needed
    
    # IJEPA embeddings from flat H5 file + JSON lookup
    ijepa_h5_path: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/h5_embeddings/ijepa_emb_flat.h5"
    ijepa_lookup_json: "/scratch/gilbreth/abelde/Thesis/StructureAwareGen/h5_embeddings/ijepa_lookup.json"
    
    ijepa_cache_dir: null
    
    max_segments: 250
    image_size: 256
    file_ext: "*.JPEG"
    normalize: true
    emb_source: "region"  # Matches the region_emb_extract source
  
  # DataLoader settings
  batch_size: 32
  num_workers: 8
  shuffle: true
  pin_memory: true


# Training configuration
training:
  # Optimization
  learning_rate: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 5000
  max_steps: 500000
  
  # Learning rate schedule
  scheduler:
    target: torch.optim.lr_scheduler.CosineAnnealingLR
    params:
      T_max: 500000
  
  # Gradient clipping
  gradient_clip_val: 1.0
  
  # Mixed precision
  use_fp16: true
  
  # Logging
  log_every_n_steps: 100
  val_check_interval: 5000
  
  # Checkpointing
  save_every_n_steps: 10000
  keep_n_checkpoints: 5


# Logging configuration
logging:
  log_dir: "rdm/rdm_out"
  wandb:
    project: "unified-seg-rdm"
    name: "region-npz-ijepa-h5"
    enabled: true
