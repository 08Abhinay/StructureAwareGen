model:
  target: rdm.models.diffusion.ddpm.UnifiedSegRDM
  params:
    seg_npz_dir: /scratch/gilbreth/abelde/Thesis/StructureAwareGen/sam_cache_unified/0/masks_npz
    max_segments: 250
    timesteps: 1000
    beta_schedule: linear
    linear_start: 0.0001
    linear_end: 0.02
    parameterization: x0
    loss_type: l2
    l_simple_weight: 1.0
    original_elbo_weight: 0.0
    learn_logvar: false
    conditioning_key: null
    channels: 256
    image_size: 251
    use_ema: true
    clip_denoised: false
    unet_config:
      target: rdm.modules.diffusionmodules.unified_transformer.UnifiedSegTransformer
      params:
        token_dim: 256
        d_model: 768
        n_heads: 12
        n_layers: 8
        d_ff: 3072
        dropout: 0.1
        max_seq_len: 256
        time_emb_dim: 256
    pretrained_enc_config:
      target: rdm.pretrained_enc.models_pretrained_enc
      params:
        pretrained_enc_arch: ijepa_vit_h14
        pretrained_enc_path: /scratch/gilbreth/abelde/Thesis/StructureAwareGen/scripts/SEG-RDM/rdm/pretrained_enc_ckpts/ijepa/IN1K-vit.h.14-300e.pth.tar
        proj_dim: 256
        pretrained_enc_withproj: false
    cond_stage_config: __is_unconditional__
    input_scale: 1.0
    scale_factor: 1.0
    scale_by_std: false
data:
  target: rdm.data.seg_dataset.SegmentationMaskDataset
  params:
    image_dir: /scratch/gilbreth/abelde/Thesis/StructureAwareGen/dataset/imagenet-1K-hf/train/0
    mask_npz_dir: /scratch/gilbreth/abelde/Thesis/StructureAwareGen/sam_cache_unified/0/masks_npz
    max_segments: 250
    image_size: 256
    file_ext: '*.jpg'
    normalize: true
  batch_size: 2
  num_workers: 0
  shuffle: true
  pin_memory: true
training:
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_steps: 5000
  max_steps: 50
  scheduler:
    target: torch.optim.lr_scheduler.CosineAnnealingLR
    params:
      T_max: 500000
      eta_min: 1.0e-06
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 5
  val_check_interval: 5000
  save_checkpoint_every_n_steps: 25
  checkpoint_dir: /scratch/gilbreth/abelde/Thesis/StructureAwareGen/scripts/SEG-RDM/rdm/debug_output
  resume_from_checkpoint: null
  num_val_samples: 8
  use_fp16: false
  num_gpus: 1
  strategy: ddp
inference:
  num_samples: 16
  batch_size: 8
  num_segments: 180
  ddpm_steps: 1000
  ddpm_eta: 0.0
  output_dir: samples/unified_seg_rdm
  save_intermediates: false
  visualize_masks: true
  visualize_attention: false
logging:
  use_wandb: false
  wandb_project: unified-seg-rdm
  wandb_entity: null
  wandb_run_name: unified-seg-rdm-v1
  use_tensorboard: true
  tensorboard_dir: /scratch/gilbreth/abelde/Thesis/StructureAwareGen/scripts/SEG-RDM/rdm/debug_output/tensorboard
  log_images: true
  log_gradients: false
  log_model_architecture: true
